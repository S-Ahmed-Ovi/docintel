# docker compose up --build   ->  UI http://localhost:3000 , API http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: docintel, POSTGRES_PASSWORD: docintel, POSTGRES_DB: docintel }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U docintel"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://docintel:docintel@db:5432/docintel
      STORAGE_DIR: /data/files
      EMBEDDED_WORKER: "0"            # workers run in their own containers
    volumes: [files:/data/files]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  worker:                              # scale with: docker compose up --scale worker=4
    build: ./backend
    command: python -m app.worker
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://docintel:docintel@db:5432/docintel
      STORAGE_DIR: /data/files
    volumes: [files:/data/files]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: "http://localhost:8000", VITE_API_KEY: "${API_KEY:-dev-key}" }
    ports: ["3000:80"]
    depends_on: [api]
volumes: { pgdata: {}, files: {} }
